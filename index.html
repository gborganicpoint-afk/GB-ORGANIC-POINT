<header><b>GB ORGANIC POINT</b><a href="https://wa.me/923432444270">WhatsApp: 0343-2444270</a></header>
<div class="hero"><h2>100% Pure Organic From GB</h2><p>Quantity & Weight Select Karein - Total Auto Calculate</p></div>
<div class="grid" id="grid"></div>
<div id="cartBar"><span id="cartText">🛒 Cart: 0 items - Rs 0</span><button onclick="checkout()">Checkout on WhatsApp</button></div>
<script>
let products=[
["🍯","Wild Honey","Honey",1899,["500g","1kg"]],
["🫒","Apricot Oil","Oil",1299,["200ml","500ml"]],
["🍑","Dried Apricots","Apricots",1499,["500g","1kg"]],
["🌰","Almonds","Almonds",2199,["500g","1kg"]],
["🥜","Walnuts","Walnuts",1799,["500g","1kg"]],
["🏔️","Shilajit","Shilajit",3499,["20g","40g"]],
["🍒","Cherry Jam","Cherry Jam",999,["400g","800g"]],
["🧃","Buckthorn Juice","Juice",1599,["500ml","1L"]],
["🍵","Green Tea","Green Tea",899,["250g","500g"]],
["🍇","Mulberry","Mulberry",1199,["500g","1kg"]],
["🍓","Apricot Jam","Apricot Jam",899,["400g","800g"]],
["🎁","Mixed Dry Fruits","Combo",2999,["500g","1kg"]],
];
let cart={};
let grid=document.getElementById('grid');
products.forEach((p,i)=>{
let price2=p[3]*2;
grid.innerHTML+=`<div class="card"><div class="emoji">${p[0]}</div><div class="b"><h3>${i+1}. ${p[1]}</h3><p>GB Pure • No Chemical</p><span class="pr">Rs ${p[3]}</span><select id="w${i}"><option>${p[4][0]} - Rs ${p[3]}</option><option>${p[4][1]} - Rs ${price2}</option></select><div class="qty"><button onclick="chg(${i},-1)">-</button><span id="q${i}">1</span><button onclick="chg(${i},1)">+</button></div><button class="add" onclick="add(${i})">Add to Cart</button></div></div>`;
});
function chg(i,d){let e=document.getElementById('q'+i);let v=parseInt(e.innerText)+d;if(v<1)v=1;if(v>20)v=20;e.innerText=v}
function add(i){
let q=parseInt(document.getElementById('q'+i).innerText);
let w=document.getElementById('w'+i).value;
let base=products[i][3];
let price=w.includes(products[i][4][1])?base*2:base;
let key=products[i][1]+" "+w.split(' -')[0];
cart[key]=(cart[key]||0)+q;
if(!cart[key+"_price"]) cart[key+"_price"]=price;
update();
alert(key+" x"+q+" Added!");
}
function update(){
let total=0,count=0;
for(let k in cart){if(!k.includes("_price")){total+=cart[k]*cart[k+"_price"];count+=cart[k]}}
document.getElementById('cartText').innerText=`🛒 Cart: ${count} items - Rs ${total}`;
}
function checkout(){
if(Object.keys(cart).length==0){alert("Cart empty hai!");return}
let msg="*GB ORGANIC POINT - NEW ORDER*%0A%0A";
let total=0;
for(let k in cart){if(!k.includes("_price")){let pr=cart[k+"_price"];let qty=cart[k];let sub=pr*qty;total+=sub;msg+=`• ${k} x ${qty} = Rs ${sub}%0A`}}
msg+=`%0A*Total: Rs ${total}*%0A%0AName:%0AAddress:%0A`;
window.open("https://wa.me/923432444270?text="+msg);
}
</script>
</body></html>
